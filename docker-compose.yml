services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 2s
      timeout: 5s
      retries: 15

  service:
    build: ./service
    ports:
      - "8000:8000"
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081,http://localhost:8082
      PUBLIC_API_BASE_URL: https://localhost:8000
      # The only setting that changes if the OAuth2 authorization server (hydra) relocates
      # to a different LAN machine — see hydra/hydra.yml's URLS_SELF_ISSUER comment. Must
      # keep matching hydra's browser-facing issuer, not the Docker-internal hostname below.
      OAUTH_ISSUER_URL: https://localhost:4444
      OAUTH_EXPECTED_AUDIENCE: https://localhost:8000
      # Docker-internal-only: "localhost" above isn't reachable from this container, so JWKS
      # fetches go here instead. Never changes on relocation — see config.py's comment.
      OAUTH_JWKS_URL: https://hydra:4444
      OAUTH_CA_BUNDLE_PATH: /certs/rootCA.pem
    volumes:
      # Generated by scripts/setup-tls.sh (or .ps1) — gitignored, per-machine.
      - ./certs:/certs:ro
    depends_on:
      valkey:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  # --- OAuth2 authorization server (Ory Hydra) + its login/consent UI ---
  #
  # hydra-sqlite-init -> hydra-migrate -> hydra, in that order. All four hydra* services
  # below (and login-consent, which they call back into) are optional infrastructure for the
  # admin client's login; `service` and the public client work fine without them.

  hydra-sqlite-init:
    image: busybox
    command: sh -c "mkdir -p /mnt/sqlite && chown -R 65532:65532 /mnt/sqlite"
    volumes:
      - hydra-sqlite:/mnt/sqlite

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    environment:
      DSN: sqlite:///mnt/sqlite/db.sqlite?_fk=true&mode=rwc
      SECRETS_SYSTEM: youReallyNeedToChangeThis
    command: migrate -c /etc/config/hydra/hydra.yml sql up -e --yes
    volumes:
      - hydra-sqlite:/mnt/sqlite
      - ./hydra:/etc/config/hydra:ro
    depends_on:
      hydra-sqlite-init:
        condition: service_completed_successfully

  hydra:
    image: oryd/hydra:v26.2.0
    ports:
      - "4444:4444" # public: authorization/token endpoints, discovery docs
      - "4445:4445" # admin: login/consent request management (login-consent talks to this)
    environment:
      DSN: sqlite:///mnt/sqlite/db.sqlite?_fk=true&mode=rwc
      SECRETS_SYSTEM: youReallyNeedToChangeThis
      # The three values that change if this AS relocates to a different LAN machine.
      URLS_SELF_ISSUER: https://localhost:4444
      URLS_LOGIN: https://localhost:4446/login
      URLS_CONSENT: https://localhost:4446/consent
    command: serve -c /etc/config/hydra/hydra.yml all
    volumes:
      - hydra-sqlite:/mnt/sqlite
      - ./hydra:/etc/config/hydra:ro
      - ./certs:/certs:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  login-consent:
    build: ./login-consent
    ports:
      - "4446:4446"
    environment:
      HYDRA_ADMIN_URL: https://hydra:4445
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      # Shorten for demos where you want the login form to reliably reappear without
      # manually revoking the session each time — see the README's OAuth2 section.
      LOGIN_REMEMBER_SECONDS: "3600"
    volumes:
      # certs/rootCA.pem (written by scripts/setup-tls.sh) lets this container's outbound
      # calls to https://hydra:4445 trust Hydra's mkcert-issued cert.
      - ./certs:/certs:ro
    depends_on:
      - hydra

volumes:
  hydra-sqlite:
