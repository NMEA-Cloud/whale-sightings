name: wombat-sightings

# App project: service, Valkey, MQTT broker, and (eventually) the containerized clients. The
# OAuth2/OIDC infrastructure (Hydra, login-consent) and step-ca live in the separate
# "booth-boat" project (infra/docker-compose.yml) — see that file's header comment for why.
# Joined to it via the whale-sightings-net external network so `service` can still resolve
# `hydra` by Docker-internal name for JWKS fetches. Create the network once per machine:
#   docker network create whale-sightings-net

services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Generated by scripts/setup-tls.sh (or .ps1) — gitignored, per-machine. The cert's
      # "mqtt" SAN is what makes TLS work over this Docker-internal hostname.
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "8883", "--cafile", "/certs/rootCA.pem", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 2s
      timeout: 5s
      retries: 15

  service:
    build: ./service
    ports:
      - "8000:8000"
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      MQTT_HOST: mqtt
      MQTT_PORT: 8883
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081,http://localhost:8082
      PUBLIC_API_BASE_URL: https://api.dev.wombat-sightings.org:8000
      # The only setting that changes if the OAuth2 authorization server (hydra) relocates
      # to a different LAN machine — see hydra/hydra.yml's URLS_SELF_ISSUER comment. Must
      # keep matching hydra's browser-facing issuer, not the Docker-internal hostname below.
      OAUTH_ISSUER_URL: https://auth.dev.booth-boat.org:4444
      OAUTH_EXPECTED_AUDIENCE: https://api.dev.wombat-sightings.org:8000
      # Docker-internal-only: "localhost" above isn't reachable from this container, so JWKS
      # fetches go here instead. Never changes on relocation — see config.py's comment. Only
      # resolves because `service` is also on whale-sightings-net, shared with the booth-boat
      # infra project that actually runs `hydra` — see this file's header comment.
      OAUTH_JWKS_URL: https://hydra:4444
      OAUTH_CA_BUNDLE_PATH: /certs/rootCA.pem
      # Trusts the broker's step-ca-issued cert for the TLS connection to mqtt:8883.
      MQTT_CA_BUNDLE_PATH: /certs/rootCA.pem
    volumes:
      # Generated by scripts/setup-tls.sh (or .ps1) — gitignored, per-machine.
      - ./certs:/certs:ro
    networks:
      default: {}
      whale-sightings-net: {}
    depends_on:
      valkey:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  # --- Static clients ---
  #
  # config.js is templated from the API_BASE/MQTT_WS_URL env vars below at container start
  # (see each client's docker-entrypoint.sh) rather than baked in at build time, so the same
  # image works for dev vs. booth by changing environment (e.g. via an override file, the
  # same pattern docker-compose.override.yml already uses for CORS_ORIGINS) rather than
  # rebuilding. client-mqtt/client-long-poll build with the repo root as context so their
  # Dockerfiles can also reach shared/, a sibling directory otherwise out of build-context
  # reach — see .dockerignore.

  client-admin:
    build:
      context: ./client-admin
    ports:
      - "8080:8080"
    environment:
      API_BASE: https://localhost:8000

  client-mqtt:
    build:
      context: .
      dockerfile: client-mqtt/Dockerfile
    ports:
      - "8081:8081"
    environment:
      API_BASE: https://localhost:8000
      MQTT_WS_URL: wss://localhost:9001

  client-long-poll:
    build:
      context: .
      dockerfile: client-long-poll/Dockerfile
    ports:
      - "8082:8082"
    environment:
      API_BASE: https://localhost:8000

networks:
  whale-sightings-net:
    external: true
