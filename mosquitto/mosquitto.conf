# Local dev/demo broker: anonymous access (no auth), but TLS on both listeners — step-ca
# issues the cert (see scripts/setup-tls.sh's "mqtt" SAN), mounted read-only from certs/ into
# this container by docker-compose.yml. Server-auth only, no client certs (no
# require_certificate), matching how Hydra's TLS is set up.
#
# 8883, not 1883: the IANA-registered port for MQTT-over-TLS ("mqtts"), same convention as
# 443 vs. 80 for HTTP — most MQTT client tools assume/default to it for TLS connections.
# There's no plain-MQTT listener left on 1883; TLS isn't optional here.
listener 8883
protocol mqtt
allow_anonymous true
cafile /certs/rootCA.pem
certfile /certs/localhost.pem
keyfile /certs/localhost-key.pem

listener 9001
protocol websockets
allow_anonymous true
cafile /certs/rootCA.pem
certfile /certs/localhost.pem
keyfile /certs/localhost-key.pem

persistence false
log_dest stdout
