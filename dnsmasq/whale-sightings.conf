# Static records for the infra project's browser-facing hostnames — mirrors the SANs
# scripts/setup-tls.sh always issues (see that script's comment for why). Dropped into
# /etc/dnsmasq.d/ inside the dockurr/dnsmasq image, which merges any *.conf file there into
# its default config (see infra/docker-compose.yml's dns service). Everything else still
# resolves normally via the DNS1/DNS2 upstream servers set there.
#
# Points at 127.0.0.1 for local single-machine dev. This value is deliberately per-machine —
# don't sync it from another checkout. If this machine runs the infra project and is reached
# by other devices on the LAN (a Raspberry Pi, say), run scripts/update-lan-dns.sh instead of
# hand-editing this to the machine's current LAN IP; re-run it any time that IP changes (new
# network, DHCP lease renewal). This is the DNS-server successor to the manual /etc/hosts
# entries from the split-infra-project phase; once this container is reachable, entries in
# /etc/hosts for these two names are no longer needed on any client machine (remove them so
# resolution is actually exercising this server, not silently masked by /etc/hosts).
address=/auth.dev.whale-auth.org/127.0.0.1
address=/api.dev.whale-sightings.org/127.0.0.1

# Log each query to stdout — useful for confirming resolution is actually going through this
# server, e.g. while diagnosing whether a client is still falling back to /etc/hosts.
log-queries
